[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bar"
version = "0.1.0"
description = "A configurable GTK side toolbar with launchers, status items, tray hosting, and an embedded terminal."
requires-python = ">=3.10"
dependencies = [
    "sshserver @ git+https://github.com/vroby65/sshserver.git@5c2791d4f54feaac75e1d7e152b91a7105c90874",
]

[project.scripts]
ai-bar = "ai_bar.app:main"

[tool.setuptools]
packages = ["ai_bar"]

[tool.setuptools.package-data]
ai_bar = ["icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
