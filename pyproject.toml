[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bar"
version = "0.1.0"
description = "A configurable GTK side toolbar with launchers, status items, tray hosting, and an embedded terminal."
requires-python = ">=3.10"
dependencies = [
    "sshserver @ git+https://github.com/vroby65/sshserver.git@65d4d37baac0e634cf6fb23d2a8e522b1398bc23",
]

[project.scripts]
ai-bar = "ai_bar.app:main"

[tool.setuptools]
packages = ["ai_bar"]

[tool.setuptools.package-data]
ai_bar = ["icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
