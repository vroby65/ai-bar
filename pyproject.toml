[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bar"
version = "0.1.0"
description = "A configurable GTK side toolbar with launchers, status items, tray hosting, and an embedded terminal."
requires-python = ">=3.10"

[project.scripts]
ai-bar = "ai_bar.app:main"

[tool.setuptools]
packages = ["ai_bar"]

[tool.pytest.ini_options]
pythonpath = ["."]
